# Outbound-only mail relay for platform alerts.
#
# This exists so the SMTP hop stays inside the host: the control plane talks to
# this container over a Docker network, and only this container talks to the
# outside world. Nothing else on the host needs to send mail.
#
# Scope matters here. `match from any` would make this an open relay reachable
# by anything that can route to it, so the match is restricted to the
# mail-control subnet, which carries only the control plane and this relay.
# Tenant runtimes are never attached to that network, and the port is never
# published to the host.

listen on 0.0.0.0

table aliases file:/etc/smtpd/aliases

queue ttl 4d
bounce warn-interval 1h, 6h, 2d
smtp max-message-size 5M

# The container's `hostname:` in compose is set to this host's real FQDN, which
# is what OpenSMTPD then announces in HELO. That matters: by default it would
# announce the container id, which is not a fully qualified name and which
# receiving MTAs penalise or refuse outright. The FQDN has matching forward and
# reverse DNS for this host's address, which is the strongest sender identity
# available here.
action outbound relay
# This subnet must equal MAIL_CONTROL_SUBNET in compose.yaml. This file is
# bind-mounted read-only and cannot read an environment variable, so the fact is
# written twice; smtp-relay-scope.test.ts fails if the two ever disagree.
# Diverging them gives a relay that refuses every alert, and the only symptom is
# alerts that never arrive.
match from src 192.168.64.128/28 for any action outbound
