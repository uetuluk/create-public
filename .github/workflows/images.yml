name: images

# Publishes the three images this repository builds, so trying the platform out
# does not require building it. Everything else in the stack — postgres,
# pgbouncer, rustfs — is already a published image pulled by digest.
#
# Tags drive releases; the manual trigger exists so a broken publish can be
# retried without inventing a version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the build record where it came from, so a pulled image can be
      # traced back to the commit that produced it.
      id-token: write
      attestations: write

    strategy:
      # One failure should not cancel the others: a partial publish is easier
      # to reason about when you can see which image actually failed.
      fail-fast: false
      matrix:
        include:
          # The platform image carries the control plane, gateway, executor and
          # build proxy, plus the CLI bundle it serves at /cli — which is why
          # its context is the repository root rather than deploy/platform.
          - name: platform
            context: .
            dockerfile: deploy/platform/Dockerfile
          - name: caddy
            context: deploy/caddy
            dockerfile: deploy/caddy/Dockerfile
          - name: render
            context: deploy/render
            dockerfile: deploy/render/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest release rather than the default branch.
      # A tag push is never on the default branch, so the built-in
      # is_default_branch condition would leave `latest` pointing at nothing —
      # which is the tag docs/try-it.md tells people to pull.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps a rebuild of an unchanged layer cheap across runs.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
